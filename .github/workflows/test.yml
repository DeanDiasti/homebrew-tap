name: Homebrew installation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: brew-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_ANALYTICS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trust only the candidate formula
        run: brew trust --formula DeanDiasti/tap/fusion-cli
      - name: Tap the candidate formula
        run: brew tap DeanDiasti/tap "$GITHUB_WORKSPACE"
      - name: Install standard-library-only CLI
        run: brew install --build-from-source DeanDiasti/tap/fusion-cli
      - name: Test offline commands and temporary add-in installation
        run: brew test DeanDiasti/tap/fusion-cli
